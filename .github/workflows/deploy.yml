name: Deploy SPA to S3

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-south-1
  SITE_DIR: site

jobs:
  validate:
    name: Validate HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint HTML
        run: npx --yes htmlhint "${{ env.SITE_DIR }}/**/*.html"

  deploy:
    name: Deploy
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Stamp build version
        run: echo "${GITHUB_SHA::7} ($(date -u +%Y-%m-%dT%H:%MZ))" > "$SITE_DIR/version.txt"

      - name: Sync assets (short cache)
        run: |
          aws s3 sync "$SITE_DIR" "s3://${{ secrets.S3_BUCKET }}" \
            --delete \
            --exclude "*.html" --exclude "version.txt" \
            --cache-control "public, max-age=300"

      - name: Upload HTML and version (no cache)
        run: |
          aws s3 sync "$SITE_DIR" "s3://${{ secrets.S3_BUCKET }}" \
            --exclude "*" --include "*.html" --include "version.txt" \
            --cache-control "no-cache"

      - name: Show site URL
        run: echo "Deployed to http://${{ secrets.S3_BUCKET }}.s3-website.${AWS_REGION}.amazonaws.com"
